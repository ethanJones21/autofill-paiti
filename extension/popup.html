<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --brand: #4169e1;
    --brand-dark: #3558c8;
    --brand-soft: #e6ebfb;
    --ink: #222;
    --muted: #777;
    --line: #c8c8c8;
    --line-soft: #e6e6e6;
    --bg: #e8e8e8;
    --danger: #c0392b;
  }
  * { box-sizing: border-box; }
  body { width: 400px; margin: 0; padding: 12px; background: var(--bg); font: 14px/1.4 Inter, system-ui, "Segoe UI", sans-serif; color: var(--ink); }
  .card { background: #fff; border-radius: 18px; padding: 16px; margin-bottom: 10px; }
  main > .card:last-child { margin-bottom: 0; }

  /* Título con punto, como en el modelo */
  .title { display: flex; align-items: center; gap: 8px; font-size: 22px; font-weight: 700; color: var(--brand); margin: 0 0 6px; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 6px var(--brand-soft); margin: 0 6px 0 4px; flex: none; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .muted, small { color: var(--muted); }

  /* Inputs */
  input[type=text], input[type=password], select, textarea {
    width: 100%; padding: 11px 12px; font: inherit; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 12px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea { resize: vertical; }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .pw { position: relative; flex: 1; }
  .pw input { padding-right: 44px; }
  .pw .eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; padding: 6px 8px; font-size: 16px; line-height: 1; }

  /* Botones */
  button { font: inherit; cursor: pointer; padding: 8px 12px; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; transition: background .15s, border-color .15s; }
  button:hover { background: #f4f4f4; }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--brand-dark); }
  button.danger { color: var(--danger); }
  button.danger:hover { background: #fdeeee; }
  button.block { width: 100%; padding: 11px; font-size: 15px; border-radius: 12px; }
  .eye:hover { background: none; }

  /* Cargando: spinner en el botón (el texto se oculta, el tamaño no cambia) y esqueletos en la lista */
  button.loading { position: relative; color: transparent !important; pointer-events: none; }
  button.loading::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .7s linear infinite;
  }
  button.primary.loading { background: var(--brand-dark); }
  button.primary.loading::after { border-color: rgba(255,255,255,.4); border-top-color: #fff; }
  button:disabled:not(.loading) { opacity: .6; cursor: default; }
  .skel .bar1, .skel .bar2 { border-radius: 6px; background: linear-gradient(90deg, #eee 25%, #f7f7f7 50%, #eee 75%); background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  .skel .bar1 { height: 14px; width: 55%; margin: 2px 0 8px; }
  .skel .bar2 { height: 10px; width: 30%; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (prefers-reduced-motion: reduce) {
    button.loading::after { animation-duration: 2s; }
    .skel .bar1, .skel .bar2 { animation: none; }
  }

  .row { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
  .row > input, .row > select { flex: 1; }

  /* Sesión */
  details > summary { list-style: none; cursor: pointer; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  /* Flecha del desplegable: apunta abajo si está cerrado y arriba si está abierto */
  .chev { color: var(--brand); font-size: 12px; transition: transform .2s; }
  details[open] > summary .chev { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
  #userBar { margin: 0; }
  #userBar .who { flex: 1; font-weight: 600; }

  /* Pestañas tipo segmentado */
  .tabs { display: flex; gap: 4px; background: #f0f0f0; border-radius: 12px; padding: 4px; margin: 0 0 12px; }
  .tabs button { flex: 1; border: 0; background: none; border-radius: 9px; padding: 8px 4px; color: var(--muted); font-weight: 500; }
  .tabs button:hover { background: #e8e8e8; }
  .tabs button.active { background: #fff; color: var(--brand); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  /* Lista de flujos */
  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .list-head .title { font-size: 18px; margin: 0; }
  .form-item { border: 1px solid var(--line-soft); border-radius: 14px; padding: 10px; margin: 8px 0; }
  .form-item > .row { margin: 0; }
  .form-item .row, .form-item.row { gap: 6px; }
  .form-item strong { font-weight: 600; }
  .form-item small { display: block; margin-top: 2px; }
  .form-item button { width: 34px; height: 34px; padding: 0; font-size: 14px; }
  .badge { display: inline-block; background: #9aa0a6; color: #fff; border-radius: 999px; padding: 1px 8px; font-size: 11px; font-weight: 500; vertical-align: middle; }
  .badge.public { background: #2e9e5b; }
  .badge.here { background: var(--brand); }
  #rec { width: 100%; margin-top: 8px; padding: 11px; border-radius: 12px; border-style: dashed; color: var(--brand); border-color: var(--brand); }
  #rec:hover { background: var(--brand-soft); }

  /* Editor de pasos */
  .field { border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px; margin: 8px 0; }
  .field > div:first-child { font-weight: 600; margin-bottom: 6px; }
  .field .row { margin: 6px 0 0; }
  .field .row button { width: auto; height: auto; padding: 5px 10px; font-size: 13px; }
  .field label.muted { display: flex; align-items: center; gap: 6px; }

  /* Mensajes */
  #status, #cfgStatus { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; display: none; white-space: pre-wrap; word-break: break-word; font-size: 13px; }
  #status.ok, #cfgStatus.ok { background: #e3f4ea; color: #1d6b3e; display: block; }
  #status.err, #cfgStatus.err { background: #fbe6e4; color: #962d22; display: block; }
  #status:empty, #cfgStatus:empty { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="card" id="sessionCard">
    <details id="loginBox" open>
      <summary><h1 class="title">Iniciar sesión</h1><span class="chev" aria-hidden="true">▼</span></summary>
      <p class="sub">Entra para ver y grabar tus flujos.</p>
      <div class="row"><input type="text" id="user" placeholder="Usuario" aria-label="Usuario" autocomplete="username"></div>
      <div class="row">
        <div class="pw">
          <input type="password" id="pass" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password">
          <button id="eye" class="eye" type="button" title="Mostrar contraseña">👁</button>
        </div>
      </div>
      <button id="login" class="primary block">Entrar</button>
    </details>
    <div id="userBar" class="row" style="display:none">
      <span class="who"><span class="dot" style="display:inline-block;vertical-align:middle;margin-right:12px"></span><span id="userName"></span></span>
      <button id="logout">Salir</button>
    </div>
    <div id="cfgStatus"></div>
  </div>

  <div class="card" id="listView">
    <div id="tabs" class="tabs">
      <button id="tabMine">Mis flujos</button><button id="tabPublic">Públicos</button>
    </div>
    <div class="list-head"><span class="muted">Flujos</span><button id="reloadFlows" title="Recargar" style="padding:4px 10px">↻</button></div>
    <div id="flows"></div>
    <button id="rec">● Grabar flujo</button>
  </div>
  <div class="card" id="editbox" style="display:none"></div>
  <div class="card" id="recbox" style="display:none"></div>

  <div id="status"></div>
</main>
<script src="popup.js"></script>
</body>
</html>
