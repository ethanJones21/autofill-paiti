<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  body { width: 400px; margin: 0; font: 13px/1.4 system-ui, sans-serif; color: #222; }
  header { background: #2c3e50; color: #fff; padding: 8px 12px; }
  main { padding: 10px 12px; }
  h3 { margin: 12px 0 6px; font-size: 13px; }
  input[type=text], input[type=password], select, textarea { width: 100%; box-sizing: border-box; padding: 4px 6px; font: inherit; }
  button { padding: 4px 10px; cursor: pointer; font: inherit; }
  button.primary { background: #337ab7; color: #fff; border: 1px solid #2e6da4; }
  button.danger { color: #a94442; }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
  .row > label { min-width: 70px; }
  .form-item { border: 1px solid #ddd; border-radius: 3px; padding: 6px; margin: 4px 0; }
  .form-item small, .muted { color: #777; }
  .badge { background: #777; color: #fff; border-radius: 8px; padding: 0 6px; font-size: 11px; }
  .badge.public { background: #5cb85c; }
  .badge.here { background: #337ab7; }
  .field { border-bottom: 1px solid #eee; padding: 4px 0; }
  .tabs { display: flex; border-bottom: 1px solid #ccc; margin: 8px 0 4px; }
  .tabs button { flex: 1; border: 0; background: none; border-bottom: 2px solid transparent; padding: 6px 4px; }
  .tabs button.active { border-bottom-color: #337ab7; font-weight: 600; color: #337ab7; }
  #status, #cfgStatus { margin-top: 8px; padding: 6px; border-radius: 3px; display: none; white-space: pre-wrap; word-break: break-word; }
  #status.ok, #cfgStatus.ok { background: #dff0d8; display: block; }
  #status.err, #cfgStatus.err { background: #f2dede; display: block; }
  details { margin-bottom: 6px; }
</style>
</head>
<body>
<header><strong>Autofill PAITI</strong></header>
<main>
  <details id="loginBox" open>
    <summary><strong>Iniciar sesión</strong></summary>
    <div class="row"><label>Usuario</label><input type="text" id="user" autocomplete="username"></div>
    <div class="row"><label>Contraseña</label><input type="password" id="pass" autocomplete="current-password"><button id="eye" type="button" title="Mostrar contraseña">👁</button></div>
    <button id="login" class="primary">Entrar</button>
  </details>
  <div id="userBar" class="row" style="display:none">
    <span style="flex:1">👤 <strong id="userName"></strong></span>
    <button id="logout">Salir</button>
  </div>
  <div id="cfgStatus"></div>

  <div id="listView">
    <div id="tabs" class="tabs">
      <button id="tabMine">Mis flujos</button><button id="tabPublic">Públicos</button>
    </div>
    <div class="row"><span class="muted" style="flex:1">Flujos</span><button id="reloadFlows" title="Recargar">↻</button></div>
    <div id="flows"></div>
    <button id="rec">● Grabar flujo</button>
  </div>
  <div id="editbox" style="display:none"></div>
  <div id="recbox" style="display:none"></div>

  <div id="status"></div>

</main>
<script src="popup.js"></script>
</body>
</html>
